<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="100%" height="100%">
    <rect width="860" height="620" fill="#FFFFFF"/>
    
    <!-- System Boundary -->
    <rect x="230" y="30" width="450" height="560" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="245" y="55" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#555555">«subsystem»</text>
    <text x="245" y="75" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000">Phân hệ Thực đơn &amp; Món Yêu thích (Dishes &amp; Favourites)</text>

    <!-- Associations: Admin to Dish CRUD -->
    <line x1="85" y1="180" x2="310" y2="120" stroke="#000000" stroke-width="1.3"/>
    <line x1="85" y1="180" x2="310" y2="185" stroke="#000000" stroke-width="1.3"/>
    <line x1="85" y1="180" x2="310" y2="250" stroke="#000000" stroke-width="1.3"/>
    <line x1="85" y1="180" x2="310" y2="315" stroke="#000000" stroke-width="1.3"/>

    <!-- Associations: Guest/User to Browse/Filter Dish -->
    <line x1="85" y1="360" x2="310" y2="185" stroke="#000000" stroke-width="1.3"/>
    <line x1="85" y1="360" x2="310" y2="380" stroke="#000000" stroke-width="1.3"/>

    <!-- Associations: User (Logged-in) to Favourites -->
    <line x1="85" y1="500" x2="310" y2="445" stroke="#000000" stroke-width="1.3"/>
    <line x1="85" y1="500" x2="310" y2="505" stroke="#000000" stroke-width="1.3"/>
    <line x1="85" y1="500" x2="310" y2="560" stroke="#000000" stroke-width="1.3"/>

    <!-- UseCase: UC-DISH-01 Thêm món vào thực đơn -->
    <g>
        <ellipse cx="455" cy="120" rx="155" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="455" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">UC-DISH-01: Thêm món ăn vào thực đơn</text>
    </g>

    <!-- UseCase: UC-DISH-02 Xem & Lọc thực đơn -->
    <g>
        <ellipse cx="455" cy="185" rx="155" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="455" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">UC-DISH-02: Xem &amp; lọc thực đơn đa tiêu chí</text>
    </g>

    <!-- UseCase: UC-DISH-03 Cập nhật món ăn -->
    <g>
        <ellipse cx="455" cy="250" rx="155" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="455" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">UC-DISH-03: Cập nhật thông tin món ăn</text>
    </g>

    <!-- UseCase: UC-DISH-04 Xóa món ăn -->
    <g>
        <ellipse cx="455" cy="315" rx="155" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="455" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">UC-DISH-04: Xoá món ăn khỏi thực đơn</text>
    </g>

    <!-- UseCase: UC-DISH-05 Gợi ý nhóm món (distinct categories) -->
    <g>
        <ellipse cx="455" cy="380" rx="155" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="455" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">UC-DISH-05: Lấy danh sách nhóm món duy nhất</text>
    </g>

    <!-- UseCase: UC-FAV-01 Thêm món yêu thích -->
    <g>
        <ellipse cx="455" cy="445" rx="155" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="455" y="449" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">UC-FAV-01: Thêm món vào danh sách Yêu thích</text>
    </g>

    <!-- UseCase: UC-FAV-02 Xóa món yêu thích -->
    <g>
        <ellipse cx="455" cy="505" rx="155" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="455" y="509" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">UC-FAV-02: Bỏ món khỏi danh sách Yêu thích</text>
    </g>

    <!-- UseCase: UC-FAV-03 Xem món yêu thích -->
    <g>
        <ellipse cx="455" cy="560" rx="155" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="455" y="564" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">UC-FAV-03: Xem danh sách món yêu thích cá nhân</text>
    </g>

    <!-- Actor: Admin -->
    <g>
        <circle cx="85" cy="150" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="162" x2="85" y2="185" stroke="#000000" stroke-width="2"/>
        <line x1="67" y1="172" x2="103" y2="172" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="185" x2="71" y2="207" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="185" x2="99" y2="207" stroke="#000000" stroke-width="2"/>
        <text x="85" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Admin</text>
        <text x="85" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Quản trị viên</text>
    </g>

    <!-- Actor: Guest -->
    <g>
        <circle cx="85" cy="325" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="337" x2="85" y2="360" stroke="#000000" stroke-width="2"/>
        <line x1="67" y1="347" x2="103" y2="347" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="360" x2="71" y2="382" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="360" x2="99" y2="382" stroke="#000000" stroke-width="2"/>
        <text x="85" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Guest</text>
        <text x="85" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Khách vãng lai</text>
    </g>

    <!-- Actor: User (Logged-in) -->
    <g>
        <circle cx="85" cy="465" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="477" x2="85" y2="500" stroke="#000000" stroke-width="2"/>
        <line x1="67" y1="487" x2="103" y2="487" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="500" x2="71" y2="522" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="500" x2="99" y2="522" stroke="#000000" stroke-width="2"/>
        <text x="85" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">User</text>
        <text x="85" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Đã đăng nhập</text>
    </g>
</svg>
