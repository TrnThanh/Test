<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
    <rect width="760" height="380" fill="#FFFFFF"/>
    
    <!-- System Boundary -->
    <rect x="210" y="30" width="370" height="320" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="225" y="55" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#555555">«subsystem»</text>
    <text x="225" y="73" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">Phân hệ Xác thực &amp; Tài khoản</text>
    
    <!-- Association Lines -->
    <line x1="85" y1="140" x2="275" y2="130" stroke="#000000" stroke-width="1.3"/>
    <line x1="85" y1="260" x2="275" y2="200" stroke="#000000" stroke-width="1.3"/>
    <line x1="675" y1="200" x2="520" y2="270" stroke="#000000" stroke-width="1.3"/>

    <!-- UseCase: Đăng ký tài khoản User -->
    <g>
        <ellipse cx="395" cy="130" rx="125" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="395" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Đăng ký tài khoản Thực khách</text>
    </g>
    <!-- UseCase: Đăng nhập tài khoản User -->
    <g>
        <ellipse cx="395" cy="200" rx="125" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="395" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Đăng nhập tài khoản Thực khách</text>
    </g>
    <!-- UseCase: Đăng nhập tài khoản Admin -->
    <g>
        <ellipse cx="395" cy="270" rx="125" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="395" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Đăng nhập Quản trị viên (Admin)</text>
    </g>

    <!-- Actor: Guest -->
    <g>
        <circle cx="85" cy="105" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="117" x2="85" y2="143" stroke="#000000" stroke-width="2"/>
        <line x1="67" y1="127" x2="103" y2="127" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="143" x2="71" y2="165" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="143" x2="99" y2="165" stroke="#000000" stroke-width="2"/>
        <text x="85" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Guest</text>
        <text x="85" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Khách vãng lai</text>
    </g>

    <!-- Actor: User -->
    <g>
        <circle cx="85" cy="225" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="237" x2="85" y2="263" stroke="#000000" stroke-width="2"/>
        <line x1="67" y1="247" x2="103" y2="247" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="263" x2="71" y2="285" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="263" x2="99" y2="285" stroke="#000000" stroke-width="2"/>
        <text x="85" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">User</text>
        <text x="85" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Thực khách</text>
    </g>

    <!-- Actor: Admin -->
    <g>
        <circle cx="675" cy="165" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="675" y1="177" x2="675" y2="203" stroke="#000000" stroke-width="2"/>
        <line x1="657" y1="187" x2="693" y2="187" stroke="#000000" stroke-width="2"/>
        <line x1="675" y1="203" x2="661" y2="225" stroke="#000000" stroke-width="2"/>
        <line x1="675" y1="203" x2="689" y2="225" stroke="#000000" stroke-width="2"/>
        <text x="675" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Admin</text>
        <text x="675" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Quản trị viên</text>
    </g>
</svg>
