<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" width="100%" height="100%">
    <rect width="740" height="420" fill="#FFFFFF"/>
    
    <!-- System Boundary -->
    <rect x="230" y="30" width="450" height="360" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="245" y="55" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#555555">«subsystem»</text>
    <text x="245" y="75" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000">Phân hệ Bữa ăn &amp; Thời tiết (Meal Types &amp; Weather)</text>

    <!-- Associations: Guest/User to Read -->
    <line x1="85" y1="160" x2="310" y2="120" stroke="#000000" stroke-width="1.3"/>
    <line x1="85" y1="160" x2="310" y2="250" stroke="#000000" stroke-width="1.3"/>

    <!-- Associations: Admin to CRUD -->
    <line x1="85" y1="300" x2="310" y2="120" stroke="#000000" stroke-width="1.3"/>
    <line x1="85" y1="300" x2="310" y2="185" stroke="#000000" stroke-width="1.3"/>
    <line x1="85" y1="300" x2="310" y2="250" stroke="#000000" stroke-width="1.3"/>
    <line x1="85" y1="300" x2="310" y2="315" stroke="#000000" stroke-width="1.3"/>

    <!-- UseCase 1: UC-MEAL-01 Xem danh sách bữa ăn -->
    <g>
        <ellipse cx="455" cy="120" rx="150" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="455" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">UC-MEAL-01: Xem danh sách loại bữa ăn</text>
    </g>

    <!-- UseCase 2: UC-MEAL-02 Tạo loại bữa ăn mới -->
    <g>
        <ellipse cx="455" cy="185" rx="150" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="455" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">UC-MEAL-02: Thêm mới loại bữa ăn (Custom)</text>
    </g>

    <!-- UseCase 3: UC-WEATH-01 Xem danh sách thời tiết -->
    <g>
        <ellipse cx="455" cy="250" rx="150" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="455" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">UC-WEATH-01: Xem danh mục trạng thái thời tiết</text>
    </g>

    <!-- UseCase 4: UC-WEATH-02 Tạo trạng thái thời tiết -->
    <g>
        <ellipse cx="455" cy="315" rx="150" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="455" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">UC-WEATH-02: Thêm mới trạng thái thời tiết</text>
    </g>

    <!-- Actor: User / Guest -->
    <g>
        <circle cx="85" cy="125" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="137" x2="85" y2="160" stroke="#000000" stroke-width="2"/>
        <line x1="67" y1="147" x2="103" y2="147" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="160" x2="71" y2="182" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="160" x2="99" y2="182" stroke="#000000" stroke-width="2"/>
        <text x="85" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">User / Guest</text>
        <text x="85" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Tra cứu gợi ý</text>
    </g>

    <!-- Actor: Admin -->
    <g>
        <circle cx="85" cy="265" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="277" x2="85" y2="300" stroke="#000000" stroke-width="2"/>
        <line x1="67" y1="287" x2="103" y2="287" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="300" x2="71" y2="322" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="300" x2="99" y2="322" stroke="#000000" stroke-width="2"/>
        <text x="85" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Admin</text>
        <text x="85" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Quản trị danh mục</text>
    </g>
</svg>
