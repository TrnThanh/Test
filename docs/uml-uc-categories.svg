<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" width="100%" height="100%">
    <rect width="740" height="420" fill="#FFFFFF"/>
    
    <!-- System Boundary -->
    <rect x="230" y="30" width="450" height="360" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="245" y="55" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#555555">«subsystem»</text>
    <text x="245" y="75" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000">Phân hệ Quản lý Danh mục Món ăn (Categories)</text>

    <!-- Associations -->
    <!-- Seller to UC1, UC2, UC3, UC4 -->
    <line x1="85" y1="210" x2="310" y2="120" stroke="#000000" stroke-width="1.3"/>
    <line x1="85" y1="210" x2="310" y2="185" stroke="#000000" stroke-width="1.3"/>
    <line x1="85" y1="210" x2="310" y2="250" stroke="#000000" stroke-width="1.3"/>
    <line x1="85" y1="210" x2="310" y2="315" stroke="#000000" stroke-width="1.3"/>
    <!-- Guest/User to UC2 (Xem danh mục quán) -->
    <line x1="85" y1="340" x2="310" y2="185" stroke="#000000" stroke-width="1.3" stroke-dasharray="3,3"/>

    <!-- UseCase 1: UC-CAT-01 Tạo danh mục mới -->
    <g>
        <ellipse cx="455" cy="120" rx="150" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="455" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">UC-CAT-01: Tạo danh mục mới cho quán</text>
    </g>

    <!-- UseCase 2: UC-CAT-02 Xem danh mục quán -->
    <g>
        <ellipse cx="455" cy="185" rx="150" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="455" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">UC-CAT-02: Xem danh mục &amp; số lượng món</text>
    </g>

    <!-- UseCase 3: UC-CAT-03 Cập nhật danh mục -->
    <g>
        <ellipse cx="455" cy="250" rx="150" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="455" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">UC-CAT-03: Cập nhật thông tin danh mục</text>
    </g>

    <!-- UseCase 4: UC-CAT-04 Xóa danh mục -->
    <g>
        <ellipse cx="455" cy="315" rx="150" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="455" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">UC-CAT-04: Xoá danh mục (SET NULL dishes)</text>
    </g>

    <!-- Actor: Seller -->
    <g>
        <circle cx="85" cy="175" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="187" x2="85" y2="213" stroke="#000000" stroke-width="2"/>
        <line x1="67" y1="197" x2="103" y2="197" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="213" x2="71" y2="235" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="213" x2="99" y2="235" stroke="#000000" stroke-width="2"/>
        <text x="85" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Seller</text>
        <text x="85" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Chủ quán ăn</text>
    </g>

    <!-- Actor: Guest / User -->
    <g>
        <circle cx="85" cy="310" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="322" x2="85" y2="345" stroke="#000000" stroke-width="2"/>
        <line x1="67" y1="332" x2="103" y2="332" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="345" x2="71" y2="368" stroke="#000000" stroke-width="2"/>
        <line x1="85" y1="345" x2="99" y2="368" stroke="#000000" stroke-width="2"/>
        <text x="85" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">User / Guest</text>
        <text x="85" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Khách xem quán</text>
    </g>
</svg>
