<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="100%" height="100%">
    <rect width="980" height="720" fill="#FFFFFF"/>
    
    <!-- System Boundary -->
    <rect x="250" y="25" width="480" height="670" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="265" y="50" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#555555">«subsystem»</text>
    <text x="265" y="70" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000">Hệ thống PTC1 (Toàn diện Backend FastAPI + PostGIS)</text>

    <!-- Associations: Guest (x=100, y=140) -->
    <line x1="100" y1="140" x2="330" y2="105" stroke="#000000" stroke-width="1.3"/>
    <line x1="100" y1="140" x2="330" y2="215" stroke="#000000" stroke-width="1.3"/>
    <line x1="100" y1="140" x2="330" y2="270" stroke="#000000" stroke-width="1.3"/>
    <line x1="100" y1="140" x2="330" y2="380" stroke="#000000" stroke-width="1.3"/>
    <line x1="100" y1="140" x2="330" y2="435" stroke="#000000" stroke-width="1.3"/>

    <!-- Associations: User (x=100, y=280) -->
    <line x1="100" y1="280" x2="330" y2="105" stroke="#000000" stroke-width="1.3"/>
    <line x1="100" y1="280" x2="330" y2="160" stroke="#000000" stroke-width="1.3"/>
    <line x1="100" y1="280" x2="330" y2="215" stroke="#000000" stroke-width="1.3"/>
    <line x1="100" y1="280" x2="330" y2="270" stroke="#000000" stroke-width="1.3"/>
    <line x1="100" y1="280" x2="330" y2="380" stroke="#000000" stroke-width="1.3"/>
    <line x1="100" y1="280" x2="330" y2="600" stroke="#000000" stroke-width="1.3"/>

    <!-- Associations: Seller (x=100, y=470) -->
    <line x1="100" y1="470" x2="330" y2="105" stroke="#000000" stroke-width="1.3"/>
    <line x1="100" y1="470" x2="330" y2="160" stroke="#000000" stroke-width="1.3"/>
    <line x1="100" y1="470" x2="330" y2="325" stroke="#000000" stroke-width="1.3"/>
    <line x1="100" y1="470" x2="330" y2="490" stroke="#000000" stroke-width="1.3"/>
    <line x1="100" y1="470" x2="330" y2="545" stroke="#000000" stroke-width="1.3"/>

    <!-- Associations: Admin (x=100, y=620) -->
    <line x1="100" y1="620" x2="330" y2="160" stroke="#000000" stroke-width="1.3"/>
    <line x1="100" y1="620" x2="330" y2="655" stroke="#000000" stroke-width="1.3"/>

    <!-- Associations: External OSM (x=880, y=380) -->
    <line x1="880" y1="380" x2="650" y2="380" stroke="#000000" stroke-width="1.3"/>

    <!-- UseCases -->
    <!-- UC 1: Đăng ký tài khoản -->
    <g>
        <ellipse cx="490" cy="105" rx="160" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="490" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Đăng ký tài khoản (User / Seller)</text>
    </g>

    <!-- UC 2: Đăng nhập -->
    <g>
        <ellipse cx="490" cy="160" rx="160" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="490" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Đăng nhập (User / Seller / Admin)</text>
    </g>

    <!-- UC 3: Xem quán & Thực đơn công khai -->
    <g>
        <ellipse cx="490" cy="215" rx="160" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="490" y="219" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Xem danh sách quán &amp; thực đơn món</text>
    </g>

    <!-- UC 4: Tìm quán gần đây GPS PostGIS -->
    <g>
        <ellipse cx="490" cy="270" rx="160" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="490" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Tìm quán gần đây theo GPS (PostGIS)</text>
    </g>

    <!-- UC 5: Quản lý Quán ăn (Seller) -->
    <g>
        <ellipse cx="490" cy="325" rx="160" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="490" y="329" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Quản lý Quán ăn (CRUD - Seller)</text>
    </g>

    <!-- UC 6: Tra cứu bản đồ OSM -->
    <g>
        <ellipse cx="490" cy="380" rx="160" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="490" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Tra cứu địa điểm &amp; Tọa độ OSM Nominatim</text>
    </g>

    <!-- UC 7: Tra cứu Bữa ăn & Thời tiết -->
    <g>
        <ellipse cx="490" cy="435" rx="160" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="490" y="439" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Tra cứu loại Bữa ăn &amp; Điều kiện Thời tiết</text>
    </g>

    <!-- UC 8: Quản lý Danh mục món ăn -->
    <g>
        <ellipse cx="490" cy="490" rx="160" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="490" y="494" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Quản lý Danh mục món ăn (Categories)</text>
    </g>

    <!-- UC 9: Quản lý Thực đơn Món ăn -->
    <g>
        <ellipse cx="490" cy="545" rx="160" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="490" y="549" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Quản lý Thực đơn Món ăn (Dishes CRUD)</text>
    </g>

    <!-- UC 10: Quản lý Món ăn Yêu thích -->
    <g>
        <ellipse cx="490" cy="600" rx="160" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="490" y="604" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Quản lý Món ăn Yêu thích (Favourites)</text>
    </g>

    <!-- UC 11: Quản trị Hệ thống -->
    <g>
        <ellipse cx="490" cy="655" rx="160" ry="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="490" y="659" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#000000">Quản trị Nền tảng &amp; Cấu hình (Admin)</text>
    </g>

    <!-- Actor: Guest -->
    <g>
        <circle cx="100" cy="105" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="100" y1="117" x2="100" y2="140" stroke="#000000" stroke-width="2"/>
        <line x1="82" y1="127" x2="118" y2="127" stroke="#000000" stroke-width="2"/>
        <line x1="100" y1="140" x2="86" y2="162" stroke="#000000" stroke-width="2"/>
        <line x1="100" y1="140" x2="114" y2="162" stroke="#000000" stroke-width="2"/>
        <text x="100" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Guest</text>
        <text x="100" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Khách vãng lai</text>
    </g>

    <!-- Actor: User -->
    <g>
        <circle cx="100" cy="245" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="100" y1="257" x2="100" y2="280" stroke="#000000" stroke-width="2"/>
        <line x1="82" y1="267" x2="118" y2="267" stroke="#000000" stroke-width="2"/>
        <line x1="100" y1="280" x2="86" y2="302" stroke="#000000" stroke-width="2"/>
        <line x1="100" y1="280" x2="114" y2="302" stroke="#000000" stroke-width="2"/>
        <text x="100" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">User</text>
        <text x="100" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Khách hàng</text>
    </g>

    <!-- Actor: Seller -->
    <g>
        <circle cx="100" cy="435" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="100" y1="447" x2="100" y2="470" stroke="#000000" stroke-width="2"/>
        <line x1="82" y1="457" x2="118" y2="457" stroke="#000000" stroke-width="2"/>
        <line x1="100" y1="470" x2="86" y2="492" stroke="#000000" stroke-width="2"/>
        <line x1="100" y1="470" x2="114" y2="492" stroke="#000000" stroke-width="2"/>
        <text x="100" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Seller</text>
        <text x="100" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Chủ quán ăn</text>
    </g>

    <!-- Actor: Admin -->
    <g>
        <circle cx="100" cy="585" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line x1="100" y1="597" x2="100" y2="620" stroke="#000000" stroke-width="2"/>
        <line x1="82" y1="607" x2="118" y2="607" stroke="#000000" stroke-width="2"/>
        <line x1="100" y1="620" x2="86" y2="642" stroke="#000000" stroke-width="2"/>
        <line x1="100" y1="620" x2="114" y2="642" stroke="#000000" stroke-width="2"/>
        <text x="100" y="658" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Admin</text>
        <text x="100" y="672" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555555">Quản trị viên</text>
    </g>

    <!-- Actor: OpenStreetMap Nominatim -->
    <g>
        <rect x="820" y="355" width="120" height="50" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="880" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000">«Secondary Actor»</text>
        <text x="880" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#000000">OSM Nominatim</text>
    </g>
</svg>